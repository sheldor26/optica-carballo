<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      :root {
        --bg: #0a0a0a;
        --fg: #fafafa;
        --muted: #9a9a9a;
        --brand: hsl(36 45% 52%);
        --serif: 'Playfair Display', Georgia, serif;
        --sans: 'Inter', system-ui, sans-serif;
      }
      html, body {
        width: 1080px;
        height: 1080px;
        overflow: hidden;
        background: var(--bg);
        font-family: 'Inter', system-ui, sans-serif;
        color: var(--fg);
      }
      #root { position: relative; width: 1080px; height: 1080px; }

      /* Cada escena ocupa el frame completo y se centra */
      .scene {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        opacity: 0;
      }

      /* ---- Escena 1 · Intro ---- */
      #intro-logo { width: 132px; height: 132px; border-radius: 28px; }
      #intro-name {
        font-family: 'Playfair Display', Georgia, serif;
        font-weight: 600;
        font-size: 76px;
        letter-spacing: 2px;
        margin-top: 34px;
      }
      #intro-tag {
        font-size: 26px;
        letter-spacing: 6px;
        text-transform: uppercase;
        color: var(--brand);
        margin-top: 18px;
      }

      /* ---- Escena 2 · Producto ---- */
      #card {
        position: relative;
        width: 860px;
        height: 560px;
        background: #fff;
        border-radius: 36px;
        overflow: hidden;
        box-shadow: 0 40px 120px rgba(0, 0, 0, 0.5);
      }
      .shot {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .shot img { width: 100%; height: auto; }
      #shot-label {
        position: absolute;
        left: 28px;
        bottom: 24px;
        font-size: 18px;
        letter-spacing: 4px;
        text-transform: uppercase;
        color: #fafafa;
        background: rgba(10, 10, 10, 0.82);
        padding: 6px 14px;
        border-radius: 999px;
      }
      #prod-brand {
        font-size: 26px;
        letter-spacing: 10px;
        color: var(--brand);
        margin-top: 46px;
      }
      #prod-model {
        font-family: 'Playfair Display', Georgia, serif;
        font-weight: 600;
        font-size: 92px;
        line-height: 1;
        margin-top: 8px;
      }
      #prod-tagline {
        font-size: 30px;
        color: var(--muted);
        margin-top: 16px;
        letter-spacing: 1px;
      }

      /* ---- Escena 3 · Specs ---- */
      #specs-title {
        font-family: 'Playfair Display', Georgia, serif;
        font-size: 44px;
        margin-bottom: 56px;
        color: var(--fg);
      }
      #specs-list {
        width: 720px;
        display: flex;
        flex-direction: column;
        gap: 26px;
      }
      .spec-row {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        border-bottom: 1px solid rgba(255, 255, 255, 0.12);
        padding-bottom: 22px;
      }
      .spec-label {
        font-size: 26px;
        letter-spacing: 3px;
        text-transform: uppercase;
        color: var(--muted);
      }
      .spec-value {
        font-size: 34px;
        font-weight: 600;
        text-align: right;
      }

      /* ---- Escena 4 · Precio / CTA ---- */
      #price-note {
        font-size: 24px;
        letter-spacing: 4px;
        text-transform: uppercase;
        color: var(--muted);
      }
      #price {
        font-family: 'Playfair Display', Georgia, serif;
        font-weight: 700;
        font-size: 150px;
        line-height: 1;
        margin: 18px 0 30px;
      }
      #includes {
        font-size: 28px;
        color: var(--brand);
        margin-bottom: 64px;
      }
      #cta {
        font-size: 40px;
        font-weight: 600;
      }
      #trust {
        font-size: 24px;
        letter-spacing: 3px;
        text-transform: uppercase;
        color: var(--muted);
        margin-top: 16px;
      }
      #outro-logo {
        width: 84px;
        height: 84px;
        border-radius: 20px;
        margin-top: 48px;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="11"
      data-width="1080"
      data-height="1080"
    >
      <!-- Escena 1 · Intro -->
      <div id="intro" class="scene clip" data-start="0" data-duration="2.6" data-track-index="0">
        <img id="intro-logo" src="assets/logo.png" alt="" />
        <div id="intro-name">Óptica Carballo</div>
        <div id="intro-tag">Anteojos de sol</div>
      </div>

      <!-- Escena 2 · Producto -->
      <div id="product" class="scene clip" data-start="2.5" data-duration="4.6" data-track-index="1">
        <div id="card">
          <div class="shot" id="shot-perfil"><img id="img-perfil" src="assets/esvep-perfil.jpg" alt="" /></div>
          <div class="shot" id="shot-frente"><img id="img-frente" src="assets/esvep-frente.jpg" alt="" /></div>
          <div id="shot-label">Perfil</div>
        </div>
        <div id="prod-brand">RUSTY</div>
        <div id="prod-model">Esvep</div>
        <div id="prod-tagline">Envolvente deportivo · Unisex</div>
      </div>

      <!-- Escena 3 · Specs -->
      <div id="specs" class="scene clip" data-start="7.1" data-duration="2.0" data-track-index="2">
        <div id="specs-title">Ficha técnica</div>
        <div id="specs-list"><!-- filas inyectadas desde data.js --></div>
      </div>

      <!-- Escena 4 · Precio / CTA -->
      <div id="outro" class="scene clip" data-start="9.1" data-duration="1.9" data-track-index="3">
        <div id="price-note">Precio final · 3 cuotas sin interés</div>
        <div id="price">$76.194</div>
        <div id="includes">Estuche + franela + garantía 1 año</div>
        <div id="cta">Envío a todo el país</div>
        <div id="trust">Óptica matriculada · 30 años</div>
        <img id="outro-logo" src="assets/logo.png" alt="" />
      </div>
    </div>

    <script src="data.js"></script>
    <script>
      // --- Inyección de datos del producto (determinística, sin red) ---
      (function () {
        var p = window.PRODUCT || {};
        var set = function (id, val) {
          var el = document.getElementById(id);
          if (el != null && val != null) el.textContent = val;
        };
        var setSrc = function (id, val) {
          var el = document.getElementById(id);
          if (el != null && val != null) el.setAttribute('src', val);
        };

        setSrc('img-perfil', p.perfil);
        setSrc('img-frente', p.frente);
        set('prod-brand', p.brand);
        set('prod-model', p.model);
        set('prod-tagline', p.tagline);
        set('price', p.price);
        set('price-note', p.priceNote);
        set('includes', p.includes);
        set('cta', p.cta);
        set('trust', p.trust);

        // Escala de las fotos dentro del card
        var scale = p.imageScale || 1;
        ['img-perfil', 'img-frente'].forEach(function (id) {
          var el = document.getElementById(id);
          if (el) el.style.transform = 'scale(' + scale + ')';
        });

        // Filas de specs
        var list = document.getElementById('specs-list');
        if (list && Array.isArray(p.specs)) {
          list.innerHTML = '';
          p.specs.forEach(function (s) {
            var row = document.createElement('div');
            row.className = 'spec-row';
            var l = document.createElement('span');
            l.className = 'spec-label';
            l.textContent = s.label;
            var v = document.createElement('span');
            v.className = 'spec-value';
            v.textContent = s.value;
            row.appendChild(l);
            row.appendChild(v);
            list.appendChild(row);
          });
        }
      })();

      // --- Timeline (en pausa, seekeable por el renderer) ---
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      // Escena 1 · Intro
      tl.set('#intro', { opacity: 1 }, 0);
      tl.from('#intro-logo', { opacity: 0, scale: 0.8, duration: 0.7, ease: 'power3.out' }, 0.1);
      tl.from('#intro-name', { opacity: 0, y: 30, duration: 0.7, ease: 'power3.out' }, 0.35);
      tl.from('#intro-tag', { opacity: 0, letterSpacing: '24px', duration: 0.8, ease: 'power2.out' }, 0.6);
      tl.to('#intro', { opacity: 0, duration: 0.5, ease: 'power1.in' }, 2.1);

      // Escena 2 · Producto
      tl.set('#product', { opacity: 1 }, 2.5);
      tl.set('#shot-frente', { opacity: 0 }, 2.5);
      tl.from('#card', { opacity: 0, y: 40, scale: 0.96, duration: 0.7, ease: 'power3.out' }, 2.6);
      tl.from('#prod-brand', { opacity: 0, y: 20, duration: 0.6 }, 2.9);
      tl.from('#prod-model', { opacity: 0, y: 24, duration: 0.6 }, 3.05);
      tl.from('#prod-tagline', { opacity: 0, y: 18, duration: 0.6 }, 3.25);
      // Swap perfil -> frente
      tl.to('#shot-perfil', { opacity: 0, duration: 0.6, ease: 'power1.inOut' }, 4.9);
      tl.to('#shot-frente', { opacity: 1, duration: 0.6, ease: 'power1.inOut' }, 4.9);
      tl.call(function () {
        var lab = document.getElementById('shot-label');
        if (lab) lab.textContent = 'Frente';
      }, null, 5.2);
      tl.to('#product', { opacity: 0, duration: 0.5, ease: 'power1.in' }, 6.7);

      // Escena 3 · Specs
      tl.set('#specs', { opacity: 1 }, 7.1);
      tl.from('#specs-title', { opacity: 0, y: 24, duration: 0.5 }, 7.2);
      tl.from('.spec-row', { opacity: 0, x: -30, duration: 0.45, stagger: 0.12, ease: 'power2.out' }, 7.4);
      tl.to('#specs', { opacity: 0, duration: 0.45, ease: 'power1.in' }, 8.75);

      // Escena 4 · Precio / CTA
      tl.set('#outro', { opacity: 1 }, 9.1);
      tl.from('#price-note', { opacity: 0, y: 16, duration: 0.5 }, 9.2);
      tl.from('#price', { opacity: 0, scale: 0.85, duration: 0.7, ease: 'back.out(1.6)' }, 9.3);
      tl.from('#includes', { opacity: 0, y: 16, duration: 0.5 }, 9.6);
      tl.from('#cta', { opacity: 0, y: 18, duration: 0.5 }, 9.8);
      tl.from('#trust', { opacity: 0, duration: 0.5 }, 10.0);
      tl.from('#outro-logo', { opacity: 0, scale: 0.8, duration: 0.6, ease: 'power3.out' }, 10.1);

      window.__timelines['main'] = tl;
    </script>
  </body>
</html>
